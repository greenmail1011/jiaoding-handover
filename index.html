<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教定區承接問答與分析</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1f2328;--sub:#6b7280;--line:#e5e3dc;--accent:#2b6cb0;--warn:#b7791f;--chip:#eef2f7}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:4px 0 14px}
.search{width:100%;padding:14px 16px;font-size:17px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.btn{padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:16px;cursor:pointer}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn small{color:inherit;opacity:.7;margin-left:4px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.item{text-align:left;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:17px;cursor:pointer}
.item small{display:block;color:var(--sub);font-size:14px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px}
.card h2{font-size:19px;margin:0 0 4px}
.who{color:var(--sub);font-size:14px;margin-bottom:10px}
ol{padding-left:22px;margin:8px 0}
li{margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--chip);border-radius:8px;padding:3px 8px;font-size:13px;color:var(--sub)}
.label{font-size:13px;color:var(--sub);margin-top:14px}
.warn{color:var(--warn);margin-top:10px;font-size:15px}
.tb{margin-top:12px;overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tb table{border-collapse:collapse;font-size:12.5px;min-width:620px;width:100%}
.tb th,.tb td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tb th{background:var(--chip);color:var(--sub);position:sticky;top:0}
.tbh{font-size:13px;color:var(--sub);margin:12px 0 4px}
.ex{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;background:var(--chip)}
.ex .exh{font-size:13px;color:var(--sub);margin-bottom:6px}
.ex pre{white-space:pre-wrap;word-break:break-word;margin:0 0 10px;font:inherit;font-size:14px;line-height:1.6}
.ex pre:last-child{margin-bottom:0}
.back{background:none;border:none;color:var(--accent);font-size:16px;padding:6px 0;cursor:pointer}
.hint{color:var(--sub);font-size:14px;margin-top:20px}
.empty{color:var(--sub);padding:16px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin:14px 0}
.pc{display:flex;flex-direction:column;align-items:center;padding:10px 6px 8px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);cursor:pointer;font-size:15px}
.pc.on{border-color:var(--accent);background:var(--chip)}
.pc b{margin-top:2px}.pc small{color:var(--sub);font-size:12px}
.home{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:10px;text-align:center;cursor:pointer;color:var(--ink);font-size:15px}
.home.on{border-color:var(--accent);background:var(--chip)}
.item{display:flex;align-items:center;gap:12px}
.item .tx{flex:1}
.hd{display:flex;align-items:center;gap:12px}
.bubble{background:var(--chip);border-radius:14px;padding:10px 14px;margin-top:10px;font-size:15px}

.chat{margin-top:10px}
.top{display:flex;align-items:center;gap:12px}
.av{display:inline-block}
#face{display:inline-block}
#face.bob{animation:bob 2.4s ease-in-out infinite}
#face.talk{animation:talk .35s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes talk{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.04)}}
#msgs{display:flex;flex-direction:column;gap:10px;margin:14px 0;min-height:120px}
.m{max-width:88%;padding:12px 14px;border-radius:16px;font-size:16px;line-height:1.55;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.m.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.m.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.bot ol{margin:6px 0 4px;padding-left:20px}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--sub);animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chips2{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips2 .btn{font-size:14px;padding:8px 12px}
.inrow{display:flex;gap:8px;position:sticky;bottom:10px}
.inrow input{flex:1;padding:14px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.inrow button{padding:0 18px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;cursor:pointer}
.sw{margin-top:8px}

.mic{background:var(--chip)!important;color:var(--ink)!important;font-size:20px!important;padding:0 14px!important}
.mic.rec{background:#e53e3e!important;color:#fff!important;animation:dot 1s infinite}
.spk{margin:6px 0;font-size:14px}

#tabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;justify-content:center;padding:10px;background:var(--bg);border-bottom:1px solid var(--line)}
#tabs button{padding:10px 22px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:16px;cursor:pointer}
#tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#an{display:none}
#an iframe{width:100%;height:calc(100vh - 62px);border:0;display:block}

#of{position:relative;height:calc(100vh - 62px);min-height:420px;background:linear-gradient(#fff6e8,#fde9d0)}
#of3d{position:absolute;inset:0}
#of .hudt{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--sub);pointer-events:none;max-width:58%}
#of .zoom{position:absolute;right:12px;top:10px;display:flex;gap:6px}
#of .zoom button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.92);font-size:20px;cursor:pointer;color:var(--ink)}
#lg{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:linear-gradient(transparent,rgba(255,246,232,.95) 40%)}
.lgb{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer;font-size:15px;text-align:left}
.lgb span{display:flex;flex-direction:column;line-height:1.25}.lgb small{color:var(--sub);font-size:12px}
#opanel{display:none;position:absolute;right:12px;top:64px;bottom:78px;width:min(430px,calc(100% - 24px));background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:8;flex-direction:column;overflow:hidden}
#opanel.on{display:flex}
#opanel .ph{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);background:#fff;font-size:14px;color:var(--sub)}
#opanel .ph button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:15px;cursor:pointer;color:var(--ink)}
#opanel.L{right:auto;left:12px}
#opanel .inrow{background:var(--bg);padding:8px 0 4px;margin-top:0;bottom:0}
#opanel .pb{padding-bottom:0!important}
#opanel .pb{flex:1;overflow:auto;padding:4px 14px 12px}
@media (max-width:700px){#opanel{left:8px;right:8px;width:auto;top:auto;height:60%;bottom:70px}}
#tip{display:none;position:absolute;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.12);pointer-events:none}
#tip small{color:var(--sub)}
</style>
</head>
<body>
<div id="tabs"><button class="on" data-t="of">🏢 辦公室</button><button data-t="qa">💬 問答</button><button data-t="an">📊 分析</button></div>
<div id="of"><div id="of3d"></div><div class="hudt">拖曳旋轉・滾輪或雙指縮放・點角色問他過去怎麼做</div><div class="zoom"><button id="pl" title="看後排">▲</button><button id="pr" title="看前排">▼</button><button id="zin" title="拉近">＋</button><button id="zout" title="拉遠">－</button><button id="zrs" title="回到預設視角">⟲</button></div><div id="opanel"><div class="ph"><span>正在問：<b id="opn"></b></span><button id="opx">✕ 關閉</button></div><div class="pb" id="opb"></div></div><div id="lg"></div><div id="tip"></div></div>
<main id="qa" style="display:none">
<h1>教定區承接問答</h1>
<input id="q" class="search" placeholder="想問什麼？打字找，例如：便當、割草、獎學金" autocomplete="off">
<div class="row" id="people"></div>
<div id="view"></div>
<p class="hint">人物是依職務畫的原創角色，不是本人長相。資料來自 LINE 群組 2022-12 至 2026-11 的訊息整理，是「過去的做法」，不是本人說的話。日期是出處，要細節可回頭查那天的訊息。日期每年會變，一定要看當年公文。</p>
</main>

&lt;style&gt;
:root{--bg:#faf8f4;--card:#fff;--ink:#23201c;--mute:#6f685f;--line:#e6dfd3;
--c1:#2b6cb0;--c2:#b7791f;--c3:#2f855a;--c4:#9b2c5a;}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,&quot;Noto Sans TC&quot;,&quot;PingFang TC&quot;,sans-serif}
header{padding:36px 20px 18px;max-width:1080px;margin:0 auto}
h1{font-size:26px;margin:0 0 6px}
.sub{color:var(--mute);font-size:14px}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
nav div{max-width:1080px;margin:0 auto;padding:8px 20px;display:flex;gap:6px;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;padding:5px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px}
nav a:hover{background:var(--card)}
section{scroll-margin-top:56px}
main{max-width:1080px;margin:0 auto;padding:10px 20px 60px}
section{margin-top:34px}
h2{font-size:20px;margin:0 0 4px}
.lead{color:var(--mute);margin:0 0 14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0;font-size:18px}
.badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;color:#fff;margin-left:8px;vertical-align:2px}
.role{color:var(--mute);font-size:13px;margin:2px 0 10px}
.card h4{font-size:13px;margin:12px 0 4px;color:var(--mute);letter-spacing:.04em}
.card ul{margin:0;padding-left:18px}
.card li{margin:2px 0}
.kpi{display:flex;gap:14px;margin:8px 0 2px;flex-wrap:wrap}
.kpi div{font-size:12px;color:var(--mute)} .kpi b{display:block;font-size:20px;color:var(--ink)}
.note{border-left:3px solid var(--c2);padding:6px 10px;background:rgba(183,121,31,.08);margin-top:10px;font-size:13px;border-radius:0 8px 8px 0}
.chartbox{position:relative;height:300px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
table.tl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13.5px}
.tl th,.tl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.tl th{background:rgba(127,127,127,.08);font-size:12.5px}
.tl td:first-child{white-space:nowrap;font-weight:600;width:64px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:6px 0 10px}
svg text{font-family:inherit}
.foot{color:var(--mute);font-size:12.5px;margin-top:30px}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;header&gt;
&lt;h1&gt;教定區壇辦班｜五位幹部承接地圖&lt;/h1&gt;
&lt;div class=&quot;sub&quot;&gt;資料來源：LINE「教定區壇辦班」群組，2022-12-26 至 2026-11-22（約 3 年 11 個月）。人物：林小慧（道務）、曾小誠（總務）、歐小慧（教育）、李小卿（區中心）、范小勇（志工輪值與除草）。&lt;/div&gt;
&lt;/header&gt;
&lt;nav&gt;&lt;div&gt;&lt;a href=&quot;#cards&quot;&gt;人物檔案卡&lt;/a&gt;&lt;a href=&quot;#charts&quot;&gt;活動數據&lt;/a&gt;&lt;a href=&quot;#timeline&quot;&gt;年度工作時間軸&lt;/a&gt;&lt;a href=&quot;#network&quot;&gt;人物關係圖&lt;/a&gt;&lt;/div&gt;&lt;/nav&gt;
&lt;main&gt;

&lt;section id=&quot;cards&quot;&gt;
&lt;h2&gt;人物檔案卡&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;每張卡片是「他在群組裡實際做什麼」。內容整理自訊息本身，看不出來的地方標為「待確認」。&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;

&lt;div class=&quot;card&quot;&gt;
&lt;h3&gt;李小卿&lt;span class=&quot;badge&quot; style=&quot;background:var(--c4)&quot;&gt;區中心&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;role&quot;&gt;教定-壇主｜群組發言量最大｜約 1,600 則有效發言（已扣除每天 05:00 自動貼的聖言量約 1,400 則）&lt;/div&gt;
&lt;h4&gt;核心工作&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;每週壇辦班：決定實體或線上、Zoom 連結與提醒、停課公告，並把壇辦班細節放進 LINE 記事本。&lt;/li&gt;
&lt;li&gt;籌辦區活動：春遊、秋聚、年末聚餐、慶元宵、夏季大典講座，含報名表、保險、分組、費用說明與事後感謝。&lt;/li&gt;
&lt;li&gt;彌勒山感恩了願小組：整理報名連結、職司表與烹飪組交接。&lt;/li&gt;
&lt;li&gt;追思、告別式、拈香助念的服裝提醒與通知。&lt;/li&gt;
&lt;li&gt;統籌三組：轉述分壇三組會議、通知區中心幹部會議，並把重點佈達全區。&lt;/li&gt;
&lt;li&gt;協助新人：帶戴小德學拜節執禮與站班。&lt;/li&gt;
&lt;li&gt;教定烹飪志工、秋季旅遊、2027 初一團拜等次年度預告。&lt;/li&gt;
&lt;/ul&gt;
&lt;h4&gt;固定節奏&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;每週：壇辦班與提醒；每月：區域割草。&lt;/li&gt;
&lt;li&gt;每季：區活動（春遊 4 月、夏季講座 7 月、秋聚 11 月、年末聚餐 1 月）。&lt;/li&gt;
&lt;/ul&gt;
&lt;h4&gt;常聯絡&lt;/h4&gt;
&lt;ul&gt;&lt;li&gt;副區中心陳小秀、區經理周小順、謝小香（收費用）、莊小章（協會會員）、三組組長與全體壇辦。&lt;/li&gt;&lt;/ul&gt;
&lt;div class=&quot;note&quot;&gt;交接重點：Zoom 會議室帳密、LINE 記事本、活動網頁與表單帳號，建議列清單。這四項是區中心的「鑰匙」。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;
&lt;h3&gt;林小慧&lt;span class=&quot;badge&quot; style=&quot;background:var(--c1)&quot;&gt;道務&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;role&quot;&gt;教定｜道務｜辦事（05 屆）｜約 300 則有效發言&lt;/div&gt;
&lt;h4&gt;核心工作&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;轉傳總壇、分壇道務組公文與班程：壇辦共修班、明道班、統班、人才班、敦化班、經典研習、關懷小組、年末懺悔、大懺悔班。&lt;/li&gt;
&lt;li&gt;收報名：用 Google 表單，截止日前提醒，再彙整回報分壇。&lt;/li&gt;
&lt;li&gt;統計統班人數與便當數，發「若無法參班請告知」的確認訊息。&lt;/li&gt;
&lt;li&gt;排辦道職司表（點道經理、上下執禮、三寶、掛號、供果、茶水、烹飪、交通）與地點、事前工作時間。&lt;/li&gt;
&lt;li&gt;每月宣導「每月一點正能量」專題講座。&lt;/li&gt;
&lt;/ul&gt;
&lt;h4&gt;固定節奏&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;年初：壇辦共修班報名（約 2 月中截止）。&lt;/li&gt;
&lt;li&gt;每月：專題講座宣導；明道班與統班報名提醒。&lt;/li&gt;
&lt;li&gt;年底：年末懺悔報名（12 月底截止）、拜年座談時段登記。&lt;/li&gt;
&lt;/ul&gt;
&lt;h4&gt;常聯絡&lt;/h4&gt;
&lt;ul&gt;&lt;li&gt;分壇道務組（李小忠點傳師）、總壇道務組（陳小修）、區經理周小順、總務曾小誠、各佛堂壇辦。&lt;/li&gt;&lt;/ul&gt;
&lt;div class=&quot;note&quot;&gt;交接重點：道務系統與 Google 表單的帳號、各班歷年報名名單的存放位置，訊息裡看不到，待確認。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;
&lt;h3&gt;曾小誠&lt;span class=&quot;badge&quot; style=&quot;background:var(--c2)&quot;&gt;總務&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;role&quot;&gt;教定-壇主（04 屆）｜約 630 則有效發言，三人中第二多&lt;/div&gt;
&lt;h4&gt;核心工作&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;承接分壇、總壇總務組指令，向全區「佈達」並找人：勤務、事前工作、洗被單、鋪墊子棉被、打掃、割草、洗水塔、普渡包裝。&lt;/li&gt;
&lt;li&gt;天道加披與告別式：分壇通知後，當天找出人選並回報。（發言量最大的一類）&lt;/li&gt;
&lt;li&gt;追思、堂慶、新春團拜的觀禮人數報名與回報。&lt;/li&gt;
&lt;li&gt;採購代訂：蘋果、各大典壽桃、睡袋、月餅、壽麵塔、禪修協會會費、中元普渡費用。&lt;/li&gt;
&lt;li&gt;排「長青班」接送與名單、每月總務動態表（打掃輪值組別）。&lt;/li&gt;
&lt;li&gt;擔任上執禮、交通接送、烹飪班等自己上場的職司。&lt;/li&gt;
&lt;li&gt;開會：分壇總務會議、三組聯合會議，回來後轉述重點。&lt;/li&gt;
&lt;/ul&gt;
&lt;h4&gt;固定節奏&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;每月：割草區域、宏宗與母殿打掃輪值、長青班接送。&lt;/li&gt;
&lt;li&gt;每季：春、夏、秋、冬大典壽桃訂購（約典禮前 1 週截止）。&lt;/li&gt;
&lt;li&gt;年度：新春團拜、老前人追思（3 月）、成道追思（5 月 1 日）、中元普渡（8 月）、堂慶（9 月）、敬老活動（10 月）。&lt;/li&gt;
&lt;/ul&gt;
&lt;h4&gt;常聯絡&lt;/h4&gt;
&lt;ul&gt;&lt;li&gt;總壇總務李小梨、分壇總務洪小銀、總務佐理戴小潭與呂小龍、區內各小組長、宏宗聯。&lt;/li&gt;&lt;/ul&gt;
&lt;div class=&quot;note&quot;&gt;交接重點：分組表（第 1 至 4 組佛堂）與打掃區域、各佛堂壽桃常訂量、宏宗聯代訂的窗口，建議交接時當面確認。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;
&lt;h3&gt;歐小慧&lt;span class=&quot;badge&quot; style=&quot;background:var(--c3)&quot;&gt;教育&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;role&quot;&gt;教定｜辦事（05 屆）｜約 210 則有效發言&lt;/div&gt;
&lt;h4&gt;核心工作&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;轉傳總壇、分壇教育組公文：青少年班、高大班、暑期三營、夏令營、師資幹部研習、全球師資培訓、經典會考、品格班、親子禪修班、成年禮。&lt;/li&gt;
&lt;li&gt;收同學報名並統計便當，常說「報名給後學」。&lt;/li&gt;
&lt;li&gt;獎學金：每年 8 至 10 月轉傳申請辦法，收件交給區獎學金委員姜小莘。&lt;/li&gt;
&lt;li&gt;協調表演彩排（母殿落成、祖師傳道、堂慶）。&lt;/li&gt;
&lt;li&gt;每週轉發《萍江竹刊》電子報。&lt;/li&gt;
&lt;li&gt;安親、品格班的現場帶領，並與劉小玲協作。&lt;/li&gt;
&lt;li&gt;收經典會考費用，在三組會議時統一繳交。&lt;/li&gt;
&lt;/ul&gt;
&lt;h4&gt;固定節奏&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;每月：青少年班、高大班報名與提醒。&lt;/li&gt;
&lt;li&gt;6 至 7 月：暑期三營入營通知；9 至 10 月：獎學金；11 月：經典會考與成年禮；12 月：堂慶運動會。&lt;/li&gt;
&lt;/ul&gt;
&lt;h4&gt;常聯絡&lt;/h4&gt;
&lt;ul&gt;&lt;li&gt;總壇、分壇教育組、劉小玲、李小德（高大班）、姜小莘（獎學金）、各佛堂家長與同學。&lt;/li&gt;&lt;/ul&gt;
&lt;div class=&quot;note&quot;&gt;交接重點：同學名單與家長聯絡方式、各班歷年課程 DM，都在她手機與 LINE 記事本，訊息裡看不到，待確認。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;
&lt;h3&gt;范小勇&lt;span class=&quot;badge&quot; style=&quot;background:#5a67d8&quot;&gt;志工輪值・除草&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;role&quot;&gt;教定-壇主（07 屆）｜約 75 則有效發言，量小但角色明確&lt;/div&gt;
&lt;h4&gt;核心工作&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;彌勒山志工輪值：每月月底前提醒「下個月的志工家人請安排日期」，再貼出教定區當月志工名單與到場時間（例：「五月志工：5/9 劉小勳、蔡小涼，07:30 到」），日期有調整就寫「原日期改某日」。&lt;/li&gt;
&lt;li&gt;區域割草（除草）：2023 年由他發起與回報；之後多由區中心與其他壇辦貼出召集，他仍固定到場。&lt;/li&gt;
&lt;li&gt;統班勤務志工召集：統班前一至兩週貼出勤務名單，說明負責的樓層與集合時間（如排一百張椅子、二樓十一張桌子）。&lt;/li&gt;
&lt;li&gt;志工組學習了願：通知「第七組」志工的活動，例如宏宗會員大會勤務與洗被單。&lt;/li&gt;
&lt;li&gt;代表本區回報母殿打掃的分工（例：整理維護花圃）、割草工具歸位上鎖。&lt;/li&gt;
&lt;/ul&gt;
&lt;h4&gt;固定節奏&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;每月：下旬提醒並公布下個月志工日期。&lt;/li&gt;
&lt;li&gt;每季至每兩個月：區域割草（約 7:00 至 7:30 集合，常有烹飪前賢準備早餐）；割草也會在追思、堂慶等大日子前加強。&lt;/li&gt;
&lt;li&gt;統班前：勤務志工名單與集合時間。&lt;/li&gt;
&lt;/ul&gt;
&lt;h4&gt;常聯絡&lt;/h4&gt;
&lt;ul&gt;&lt;li&gt;總務曾小誠、區中心李小卿、莊小章、謝小香、林小、黃小倍，與烹飪前賢（鄭小雲、彭小鍊、蔡小烽）。&lt;/li&gt;&lt;/ul&gt;
&lt;div class=&quot;note&quot;&gt;交接重點：志工輪值表是他手寫整理再請人打字（曾請張小豪製表），最新版本與各佛堂志工的固定日期，待確認。&lt;/div&gt;
&lt;/div&gt;

&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;timeline&quot;&gt;
&lt;h2&gt;年度工作時間軸&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;依 2023 至 2026 年重複出現的事項整理。日期每年會變，以當年公文為準。&lt;/p&gt;
&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i class=&quot;dot&quot; style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;道務&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;dot&quot; style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;總務&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;dot&quot; style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;教育&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;dot&quot; style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;區中心&lt;/span&gt;&lt;/div&gt;
&lt;table class=&quot;tl&quot; id=&quot;tl&quot;&gt;&lt;/table&gt;
&lt;div class=&quot;card&quot; style=&quot;margin-top:14px&quot;&gt;&lt;b&gt;每週、每月都會發生的事&lt;/b&gt;&lt;ul style=&quot;margin:6px 0 0;padding-left:18px&quot;&gt;
&lt;li&gt;&lt;i class=&quot;dot&quot; style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;每週：壇辦班（晚上 7:30，實體與 Zoom 線上交替），區中心提醒與公告。&lt;/li&gt;
&lt;li&gt;&lt;i class=&quot;dot&quot; style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;每月：總務動態表（宏宗與母殿打掃輪值組別）、區域割草、長青班接送名單。&lt;/li&gt;
&lt;li&gt;&lt;i class=&quot;dot&quot; style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;每月：專題講座宣導；統班、明道班報名統計。&lt;/li&gt;
&lt;li&gt;&lt;i class=&quot;dot&quot; style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;每月：青少年班與高大班報名與提醒；每週轉發《萍江竹刊》。&lt;/li&gt;
&lt;li&gt;&lt;i class=&quot;dot&quot; style=&quot;background:#5a67d8&quot;&gt;&lt;/i&gt;每月：彌勒山志工輪值（范小勇月底前提醒並公布下月教定區志工日期）；區域割草約每 1 至 2 個月一次。&lt;/li&gt;
&lt;li&gt;每月：分壇三組聯合會議、總務會議，各組回來後向全區轉述。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/section&gt;

function renderPeople(){
  peopleBox.className="grid";
  peopleBox.innerHTML="";
  const all=document.createElement("button");
  all.className="home"+(cur===null?" on":"");
  all.innerHTML='<div style="font-size:34px;line-height:1.3">📅</div><b>本月做什麼</b>';
  all.onclick=()=>{cur=null;q.value="";home()};
  peopleBox.appendChild(all);
  D.forEach((p,i)=>{
    const b=document.createElement("button");
    b.className="pc"+(cur===i?" on":"");
    b.innerHTML=av(i,78)+"<b>"+esc(p.n)+"</b><small>"+esc(p.r)+"</small>";
    b.onclick=()=>{cur=i;q.value="";personList(i)};
    peopleBox.appendChild(b);
  });
}

function home(){
  renderPeople();
  const m=new Date().getMonth()+1;
  let h='<div class="label">現在是 '+m+' 月，過去這個時候，各位在做：</div><div class="list">';
  let any=false;
  D.forEach((p,i)=>{
    if(p.month[m]){any=true;h+='<button class="item" data-p="'+i+'">'+av(i,52)+'<span class="tx"><b>'+esc(p.n)+'</b>（'+esc(p.r)+'）<small>'+esc(p.month[m])+'</small></span></button>'}
  });
  if(!any)h+='<div class="empty">這個月在紀錄裡沒有固定的工作。</div>';
  h+='</div><div class="label">看別的月份</div><div class="row" id="months"></div>';

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micUsed=false;
function setupMic(i){
  const mic=$("#mic"),vm=$("#vmsg");if(!mic)return;
  if(!SR){mic.style.display="none";vm.textContent=" 這個瀏覽器沒有語音輸入，請改用 Chrome 或 Safari。";return}
  const r=new SR();r.lang="zh-TW";r.interimResults=false;r.maxAlternatives=1;
  let on=false;
  mic.onclick=()=>{
    if(on){r.stop();return}
    try{r.start()}catch(e){}
  };
  r.onstart=()=>{on=true;mic.classList.add("rec");vm.textContent=" 請說話…"};
  r.onend=()=>{on=false;mic.classList.remove("rec");vm.textContent=""};
  r.onerror=e=>{vm.textContent=" 聽不到（"+e.error+"）。請允許麥克風，或改用打字。"};
  r.onresult=e=>{
    const v=e.results[0][0].transcript.trim();

  };
}
function personList(i){chat(i)}
function norm(t){return t.replace(/[\s，。？！、,.?!「」（）()]/g,"")}
function grams(t){const r=new Set();t=norm(t);for(let k=0;k<t.length-1;k++)r.add(t.slice(k,k+2));return r}
function score(text,t){
  const g=grams(text);let sc=0;
  (t.t+" "+t.k).split(/\s+/).forEach(w=>{if(w&&text.includes(w))sc+=3+w.length});
  const tg=grams(t.t+t.k+t.s.join(""));
  g.forEach(x=>{if(tg.has(x))sc+=1});
  return sc;
}
function best(text,only){
  let r=null;
  D.forEach((p,i)=>{if(only!==undefined&&i!==only)return;p.t.forEach((t,j)=>{const sc=score(text,t);if(sc>0&&(!r||sc>r.sc))r={i,j,sc}})});
  return r&&r.sc>=3?r:null;
}
function replyHTML(i,j,pre){

function chat(i){

  view.innerHTML='<div class="chat"><div class="top"><span id="face" class="bob">'+av(i,84)+'</span><div><b>'+esc(p.n)+'</b>（'+esc(p.r)+'）<div class="bubble">問我過去怎麼做的，點下面或直接打字</div></div></div>'+

  const mb=document.createElement("button");mb.className="btn";mb.textContent="這個月做什麼";mb.onclick=()=>ask(i,"這個月");cs.appendChild(mb);

function say(i,html,talk){

var GX0=-5.8,GX1=5.8,GZ0=-11.8,GZ1=3.4,CS=.4;
var NX=Math.ceil((GX1-GX0)/CS),NZ=Math.ceil((GZ1-GZ0)/CS);
var OBS=[];
OBS.push([-1.15,1.15,-8.0,-.4]);   // 大長桌
DESKS.forEach(function(d){OBS.push([d.x-.5,d.x+.5,d.z-.5,d.z+.5])});   // 椅子
OBS.push([-1.45,1.45,-11.2,-9.4]);          // 經理桌
OBS.push([-6.2,-5.0,-11.8,-8.2]);       // 書櫃
OBS.push([-6.2,-4.8,.4,2.3]);           // 影印機
OBS.push([4.9,6.2,.1,1.7]);             // 飲水機
OBS.push([-6.2,-4.9,-12.2,-10.9]);OBS.push([4.9,6.2,-12.2,-10.9]);
var grid=new Uint8Array(NX*NZ);
for(var gx=0;gx<NX;gx++)for(var gz=0;gz<NZ;gz++){
  var x=GX0+(gx+.5)*CS,z=GZ0+(gz+.5)*CS,bad=0;
  for(var k=0;k<OBS.length;k++){var o=OBS[k];if(x>o[0]-.22&&x<o[1]+.22&&z>o[2]-.22&&z<o[3]+.22){bad=1;break}}
  grid[gx*NZ+gz]=bad}
function cellOf(x,z){return [Math.max(0,Math.min(NX-1,Math.floor((x-GX0)/CS))),Math.max(0,Math.min(NZ-1,Math.floor((z-GZ0)/CS)))]}
function free(x,z){var c=cellOf(x,z);return !grid[c[0]*NZ+c[1]]}
function los(a,b){var n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/.15);for(var i=0;i<=n;i++){var t=i/n;if(!free(lerp(a[0],b[0],t),lerp(a[1],b[1],t)))return false}return true}
function findPath(a,b){
  var s=cellOf(a[0],a[1]),e=cellOf(b[0],b[1]);
  var prev=new Int32Array(NX*NZ).fill(-2),q=[s[0]*NZ+s[1]],h=0;prev[q[0]]=-1;
  var tgt=e[0]*NZ+e[1];
  while(h<q.length){var cur=q[h++];if(cur===tgt)break;var cx=(cur/NZ)|0,cz=cur%NZ;
    for(var dx=-1;dx<=1;dx++)for(var dz=-1;dz<=1;dz++){if(!dx&&!dz)continue;
      var nx=cx+dx,nz=cz+dz;if(nx<0||nz<0||nx>=NX||nz>=NZ)continue;var id=nx*NZ+nz;
      if(prev[id]!==-2||grid[id])continue;
      if(dx&&dz&&(grid[(cx+dx)*NZ+cz]||grid[cx*NZ+cz+dz]))continue;
      prev[id]=cur;q.push(id)}}
  if(prev[tgt]===-2)return [b];
  var pts=[],c=tgt;while(c!==-1){pts.push([GX0+((c/NZ|0)+.5)*CS,GZ0+(c%NZ+.5)*CS]);c=prev[c]}
  pts.reverse();pts[0]=a;pts[pts.length-1]=b;
  var out=[],i0=0;while(i0<pts.length-1){var j=pts.length-1;while(j>i0+1&&!los(pts[i0],pts[j]))j--;out.push(pts[j]);i0=j}
  return out}

Person.prototype.apply=function(time,walkAmt){
  var g=this.g,s=this.sit,ph=this.ph+time;
  g.position.set(this.pos.x,lerp(0,-.07,s),this.pos.z);g.rotation.y=this.rot;
  // 腿
  var sw=Math.sin(ph*9)*.75*walkAmt;
  this.legL.s.rotation.x=lerp(sw,-Math.PI/2,s);this.legR.s.rotation.x=lerp(-sw,-Math.PI/2,s);
  this.legL.k.rotation.x=lerp(Math.max(0,-sw)*.9,Math.PI/2,s);this.legR.k.rotation.x=lerp(Math.max(0,sw)*.9,Math.PI/2,s);
  // 手
  var m=this.armMode,aL=this.armL,aR=this.armR,tt=time*1;
  var L=[0,.12],R=[0,-.12]; // x,z 預設
  var aLx=-sw*.9,aRx=sw*.9,kL=-.1,kR=-.1;
  if(m==="type"){var ty=Math.sin(ph*14)*.08;aLx=-1.15+ty;aRx=-1.15-ty;kL=-.5;kR=-.5}
  else if(m==="cup"){aRx=-1.7;kR=-1.2;aLx=0}
  else if(m==="reach"){aRx=-2.4+Math.sin(ph*3)*.15;kR=-.2;aLx=0}
  else if(m==="write"){aRx=-2.6;kR=-.3+Math.sin(ph*8)*.5;aLx=0}
  else if(m==="talk"){aRx=-.9+Math.sin(ph*5)*.5;kR=-1+Math.sin(ph*5)*.4;aLx=-.4+Math.sin(ph*4+1)*.3;kL=-.6}
  else if(m==="wave"){aRx=-2.9;aR.s.rotation.z=-.3;kR=-.2+Math.sin(ph*10)*.5}
  if(m!=="wave")aR.s.rotation.z=-.12;
  aL.s.rotation.x=aLx;aR.s.rotation.x=aRx;aL.k.rotation.x=kL;aR.k.rotation.x=kR;aL.s.rotation.z=.12;
  // 頭、身體
  var bob=walkAmt?Math.abs(Math.sin(ph*9))*.06:0;
  this.head.position.y=1.62+bob;this.head.rotation.x=(m==="type"?-.12+Math.sin(ph*3)*.05:0);
  this.head.rotation.y=m==="talk"?Math.sin(ph*1.5)*.3:0;
  if(walkAmt)g.position.y+=bob*.6;
  this.lb.position.y=2.75+(this.sit<.5?.12:-.05)};

Person.prototype.update=function(dt,time){
  var s=this.state,walk=0;
  if(s==="sit"){this.sit=Math.min(1,this.sit+dt*2.5);this.armMode=this.hold?"talk":"type";this.text=this.hold?"正在回答你的問題":"坐著工作中";
    this.pos.x=this.seat.x;this.pos.z=this.seat.z;turn(this,this.faceRot,dt);
    if(!this.hold){this.t-=dt;if(this.t<=0||(meeting.on&&!this.mtg))this.state="stand"}}
  else if(s==="stand"){this.sit=Math.max(0,this.sit-dt*2.2);this.armMode="idle";this.text="站起來";
    var k=this.sit;this.pos.x=lerp(this.stand.x,this.seat.x,k);this.pos.z=lerp(this.stand.z,this.seat.z,k);
    if(k===0){this.act=this.pickAct();this.path=findPath([this.stand.x,this.stand.z],this.act.pos);this.state="walk";this.after="act"}}
  else if(s==="walk"||s==="back"){this.armMode="idle";walk=1;
    this.text=s==="walk"?(this.act?this.act.t:"走動中"):"走回座位";
    var tgt=this.path[0];
    if(!tgt){this.state=this.after==="act"?"act":"sitdown";this.t=this.act?rnd(this.act.dur[0],this.act.dur[1]):0}
    else{var dx=tgt[0]-this.pos.x,dz=tgt[1]-this.pos.z,dist=Math.hypot(dx,dz);
      turn(this,Math.atan2(dx,dz),dt,9);
      var step=Math.min(dist,SPEED*dt);
      if(dist<.05)this.path.shift();else{this.pos.x+=dx/dist*step;this.pos.z+=dz/dist*step}}}
  else if(s==="act"){this.armMode=this.act.arm;this.text=this.act.a||this.act.t;
    var ok=turn(this,Math.atan2(this.act.f[0]-this.pos.x,this.act.f[1]-this.pos.z),dt,6);
    if(this.hold)this.t=Math.min(this.t,.3);this.t-=dt;if(this.t<=0&&!(meeting.on&&this.act.n==="開會")){this.path=findPath([this.pos.x,this.pos.z],[this.stand.x,this.stand.z]);this.state="back";this.after="sit"}
    if(meeting.on&&this.act.n==="開會"&&meeting.left<=0){this.path=findPath([this.pos.x,this.pos.z],[this.stand.x,this.stand.z]);this.state="back";this.after="sit"}}
  else if(s==="sitdown"){this.armMode="idle";this.text="坐回座位";
    this.rot=wrap(this.rot);var done=turn(this,this.faceRot,dt,8);
    this.sit=Math.min(1,this.sit+dt*2.2);var kk=this.sit;
    this.pos.x=lerp(this.stand.x,this.seat.x,kk);this.pos.z=lerp(this.stand.z,this.seat.z,kk);
    if(kk>=1){this.state="sit";this.t=rnd(45,100)}}
  this.apply(time,walk)};

var meeting={on:false,fresh:false,left:0,next:rnd(120,180),slots:[]};
(function(){var c=[0,1],r=2.3;for(var i=0;i<5;i++){var a=Math.PI*(.15+i*.34);meeting.slots.push([c[0]+Math.cos(a+3.5)*r,c[1]+Math.sin(a+3.5)*r])}})();
meeting.slots=[[-1.8,-8.5],[-.6,-8.9],[.6,-8.9],[1.8,-8.5],[0,-8.3]];
/* 人與人不能穿過彼此：互相推開，且不會被推進家具裡 */
function separate(){
  var R=.72;
  for(var it=0;it<2;it++)for(var a=0;a<people.length;a++)for(var b=a+1;b<people.length;b++){
    var p=people[a],q=people[b];
    var dx=q.pos.x-p.pos.x,dz=q.pos.z-p.pos.z,d=Math.hypot(dx,dz);
    if(d>=R)continue;
    if(d<.001){dx=(a%2?1:-1);dz=.3;d=Math.hypot(dx,dz)}
    var push=(R-d)/2,ux=dx/d,uz=dz/d;
    var pSit=p.state==="sit"&&p.sit>=1,qSit=q.state==="sit"&&q.sit>=1;
    if(pSit&&qSit)continue;
    var wp=pSit?0:(qSit?1:.5),wq=qSit?0:(pSit?1:.5);
    nudge(p,-ux*push*2*wp,-uz*push*2*wp);nudge(q,ux*push*2*wq,uz*push*2*wq)}}
function nudge(p,dx,dz){
  if(!dx&&!dz)return;
  var nx=p.pos.x+dx,nz=p.pos.z+dz;
  if(free(nx,nz)){p.pos.x=nx;p.pos.z=nz}
  else if(free(nx,p.pos.z)){p.pos.x=nx}
  else if(free(p.pos.x,nz)){p.pos.z=nz}}
function meetingTick(dt){
  meeting.fresh=false;
  if(!meeting.on){meeting.next-=dt;if(meeting.next<=0){meeting.on=true;meeting.fresh=true;meeting.left=10;meeting.age=0;people.forEach(function(p){p.mtg=false})}}
  else{var allThere=people.every(function(p){return p.state==="act"&&p.act&&p.act.n==="開會"});
    meeting.age+=dt;if(allThere)meeting.left-=dt;
    if(meeting.left<=0||meeting.age>60){meeting.on=false;meeting.next=rnd(240,360)}}}

/* ---------- 相機（拖曳旋轉／縮放） ---------- */
var cs={az:0,pol:.95,r:20,tx:0,ty:.6,tz:-4.6};
function camUpdate(){
  cs.pol=Math.max(.35,Math.min(1.35,cs.pol));cs.r=Math.max(9,Math.min(38,cs.r));cs.az=Math.max(-1.5,Math.min(1.5,cs.az));cs.tz=Math.max(-8,Math.min(1,cs.tz));
  cam.position.set(cs.tx+cs.r*Math.sin(cs.pol)*Math.sin(cs.az),cs.ty+cs.r*Math.cos(cs.pol),cs.tz+cs.r*Math.sin(cs.pol)*Math.cos(cs.az));
  cam.lookAt(cs.tx,cs.ty,cs.tz)}
var drag=null,moved=0,pointers={};
var el=renderer.domElement;el.style.touchAction="none";el.style.display="block";
el.addEventListener("pointerdown",function(e){el.setPointerCapture(e.pointerId);pointers[e.pointerId]=[e.clientX,e.clientY];drag={x:e.clientX,y:e.clientY};moved=0});
el.addEventListener("pointermove",function(e){
  var ids=Object.keys(pointers);
  if(pointers[e.pointerId]){
    if(ids.length===2){var o=ids.filter(function(k){return +k!==e.pointerId})[0];var pa=pointers[o],pb=pointers[e.pointerId];
      var d0=Math.hypot(pa[0]-pb[0],pa[1]-pb[1]);pointers[e.pointerId]=[e.clientX,e.clientY];
      var d1=Math.hypot(pa[0]-e.clientX,pa[1]-e.clientY);cs.r*=d0/Math.max(1,d1);moved=99;camUpdate();return}
    pointers[e.pointerId]=[e.clientX,e.clientY]}
  if(drag&&ids.length<2){var dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>6){cs.az-=dx*.006;cs.pol-=dy*.005;camUpdate()}drag={x:e.clientX,y:e.clientY}}
  else if(!drag)hover(e)});
el.addEventListener("pointerup",function(e){delete pointers[e.pointerId];
  if(drag&&moved<=6){var i=pick(e);if(i!==null)(window.openChat||window.openPerson)(i)}drag=null});
el.addEventListener("pointercancel",function(e){delete pointers[e.pointerId];drag=null});
el.addEventListener("pointerleave",function(){tip.style.display="none"});
el.addEventListener("wheel",function(e){e.preventDefault();cs.r*=e.deltaY>0?1.08:.93;camUpdate()},{passive:false});
var ray=new T.Raycaster(),mv=new T.Vector2(),tip=document.getElementById("tip");
function pick(e){
  var r=el.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mv,cam);
  var hits=ray.intersectObjects(people.map(function(p){return p.g}),true);
  for(var k=0;k<hits.length;k++){var o=hits[k].object;if(o.isSprite)continue;while(o&&o.userData.pid===undefined)o=o.parent;if(o)return o.userData.pid}
  return null}
function hover(e){
  var i=pick(e);
  if(i===null){tip.style.display="none";el.style.cursor="grab";return}
  el.style.cursor="pointer";var p=people[i];
  tip.innerHTML="<b>"+D[i].n+"</b>（"+D[i].r+"）<br>"+p.text+"<br><small>點一下，問他過去怎麼做</small>";
  var r=host.getBoundingClientRect();tip.style.left=(e.clientX-r.left+14)+"px";tip.style.top=(e.clientY-r.top+14)+"px";tip.style.display="block"}
document.getElementById("zin").onclick=function(){cs.r*=.85;camUpdate()};
document.getElementById("zout").onclick=function(){cs.r*=1.18;camUpdate()};
document.getElementById("pl").onclick=function(){cs.tz-=3;camUpdate()};
document.getElementById("pr").onclick=function(){cs.tz+=3;camUpdate()};
document.getElementById("zrs").onclick=function(){cs.az=0;cs.pol=.95;cs.r=20;cs.tz=-4.6;camUpdate()};

/* ---------- 圖例 ---------- */
var lg=document.getElementById("lg");
people.forEach(function(p,i){var b=document.createElement("button");b.className="lgb";
  b.innerHTML=av(i,34)+"<span><b>"+D[i].n+"</b><small id='st"+i+"'>坐著工作中</small></span>";
  b.onclick=function(){(window.openChat||window.openPerson)(i)};lg.appendChild(b)});
var stTimer=0;

/* ---------- 迴圈 ---------- */
function resize(){var w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);el.style.width=w+"px";el.style.height=h+"px";cam.aspect=w/h;
  if(!resize.done&&w>40){resize.done=1;if(w/h<1)cs.r=Math.min(38,21/(w/h))}cam.updateProjectionMatrix();camUpdate()}
window.addEventListener("resize",resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(host);
var last=performance.now(),clock=0;
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(!host.offsetParent||document.hidden)return;
  clock+=dt;meetingTick(dt);
  people.forEach(function(p){p.update(dt,clock)});separate();mgr.armMode=(Math.floor(clock/7)%2)?'talk':'type';mgr.apply(clock,0);
  stTimer+=dt;if(stTimer>.6){stTimer=0;people.forEach(function(p,i){var e=document.getElementById("st"+i);if(e)e.textContent=p.text})}
  renderer.render(scene,cam)}
resize();camUpdate();requestAnimationFrame(loop);
function talk(i){people.forEach(function(p){p.hold=false});if(i!==null&&people[i])people[i].hold=true}
window.__office={talk:talk,people:people,meeting:meeting,cs:cs,cam:cam,camUpdate:camUpdate};
})();

</script>
